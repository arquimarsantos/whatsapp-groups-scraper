name: WhatsApp Groups Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

jobs:
  scraper:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node gruposwats.js
